name: Build and Release Application

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # -------------------------------------------------------------
  # Job 1: Test Phase
  # -------------------------------------------------------------
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 xvfb

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Basic Import Verification
        shell: bash
        run: |
          python -c "import PyQt6; print('PyQt6 imported successfully')"

  # -------------------------------------------------------------
  # Job 2: Build Executables (Release Tags Only)
  # -------------------------------------------------------------
  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    name: Build Binary on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: LMS-Tracker-Windows
            asset_name: lms-tracker-win-x64
          - os: ubuntu-latest
            artifact_name: LMS-Tracker-Linux
            asset_name: lms-tracker-linux-x64

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Executable with PyInstaller
        shell: bash
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "${{ matrix.artifact_name }}" src/main.py

      - name: Zip Executable Directory
        shell: bash
        run: |
          cd dist
          zip -r ../${{ matrix.asset_name }}.zip ./*

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}.zip

  # -------------------------------------------------------------
  # Job 3: Publish GitHub Release
  # -------------------------------------------------------------
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release & Upload Binaries
        uses: softprops/action-gh-release@v1
        with:
          files: |
            */*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}